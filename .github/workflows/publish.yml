name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: npm/mcp-connect/package-lock.json

      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@latest

      - name: Verify release tag and package version
        working-directory: npm/mcp-connect
        run: |
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi

      - name: Install, test, and inspect package
        run: |
          npm ci --prefix npm/mcp-connect
          npm test --prefix npm/mcp-connect
          npm run pack:check --prefix npm/mcp-connect

      - name: Publish package with provenance
        working-directory: npm/mcp-connect
        run: npm publish --access public --provenance
