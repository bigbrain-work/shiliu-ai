name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/mcp-connect/package-lock.json

      - name: Install CLI dependencies
        run: npm ci --prefix npm/mcp-connect

      - name: Test CLI
        run: npm test --prefix npm/mcp-connect

      - name: Test public distribution integrity
        run: node --test scripts/public-skill-integrity.test.mjs scripts/p3-installer-build.test.mjs

      - name: Test the POSIX MCP onboarding helper with mocked clients
        run: |
          dash -n connect-mcp.sh
          dash scripts/test-connect-mcp.sh

      - name: Verify package contents
        run: npm run pack:check --prefix npm/mcp-connect

      - name: Discover public skills
        run: npx -y skills add . --list -a codex

      - name: Build and verify website Skill distribution
        run: |
          node scripts/build-public-site-assets.mjs .tmp/public-site
          node scripts/verify-skill-distribution.mjs .tmp/public-site/.well-known/agent-skills

      - name: Discover generated website Skill archive
        run: node scripts/test-skill-distribution-install.mjs .tmp/public-site

  cli-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.14.1
          cache: npm
          cache-dependency-path: npm/mcp-connect/package-lock.json

      - name: Verify the declared minimum CLI runtime
        run: |
          npm ci --prefix npm/mcp-connect
          npm test --prefix npm/mcp-connect
          npm run pack:check --prefix npm/mcp-connect

      - name: Install the packaged CLI with strict minimum-runtime engines
        working-directory: npm/mcp-connect
        run: |
          tarball="$(npm pack --silent)"
          cold_prefix="$(mktemp -d)"
          npm install --prefix "$cold_prefix" --engine-strict --no-fund "$PWD/$tarball"
          npm audit --prefix "$cold_prefix" --json > "$cold_prefix/audit.json" || true
          node "$GITHUB_WORKSPACE/scripts/check-npm-audit.mjs" "$cold_prefix/audit.json"
          cold_cli="$cold_prefix/node_modules/.bin/shiliu"
          "$cold_cli" --version
          "$cold_cli" skill install --agent claude-code --scope user --dry-run --json --home "$cold_prefix/isolated-user"
          mkdir "$cold_prefix/project"
          (cd "$cold_prefix/project" && "$cold_cli" skill refresh --force --json --home "$cold_prefix/isolated-user")
          test ! -e "$cold_prefix/isolated-user"
          test -z "$(find "$cold_prefix/project" -mindepth 1 -print -quit)"

  windows-validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/mcp-connect/package-lock.json

      - name: Parse the Windows installer
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      - name: Test Windows prerequisite branches
        run: ./scripts/test-install-windows.ps1

      - name: Test the Windows MCP onboarding helper with mocked clients
        run: powershell.exe -NoProfile -File ./scripts/test-connect-mcp.ps1

      - name: Install CLI dependencies
        run: npm ci --prefix npm/mcp-connect

      - name: Test CLI on Windows
        run: npm test --prefix npm/mcp-connect

      - name: Test public distribution integrity on Windows
        run: node --test scripts/public-skill-integrity.test.mjs scripts/p3-installer-build.test.mjs

      - name: Verify package contents
        run: npm run pack:check --prefix npm/mcp-connect

      - name: Install and smoke-test the branch package
        working-directory: npm/mcp-connect
        run: |
          $package = Get-Content -LiteralPath ./package.json -Raw | ConvertFrom-Json
          $tarball = (npm pack --silent).Trim()
          npm install --global (Join-Path $PWD $tarball)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $actualVersion = (shiliu --version).Trim()
          if ($actualVersion -ne $package.version) {
            throw "CLI version mismatch: expected $($package.version), got $actualVersion"
          }

          shiliu login --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          shiliu install --agent codex --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Discover public skills on Windows
        run: npx -y skills add . --list -a codex
